<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Precios - Simple 100% Local</title>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<script>try{pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js"}catch(e){}</script>
<style>
*{box-sizing:border-box}body{margin:0;padding:20px;font-family:system-ui;background:#1a1530;color:#fff;min-height:100vh}
.card{background:#2a2a4a;border-radius:16px;padding:16px;margin-bottom:16px;max-width:700px;margin-left:auto;margin-right:auto}
.btn{padding:12px;border-radius:10px;border:none;font-weight:800;cursor:pointer;width:100%;margin-top:8px}
.btn-primary{background:#4b7a55;color:#fff}
.btn-secondary{background:#333;color:#fff}
.upload{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{padding:12px;border-radius:12px;background:rgba(255,255,255,0.08);text-align:center}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:10px}
th{color:#aaa;text-align:left;padding:6px;background:rgba(255,255,255,0.05)}
td{padding:6px;border-top:1px solid rgba(255,255,255,0.1)}
</style>
</head>
<body>
<div class="card" style="text-align:center"><h2 style="margin:0">💲 Admin Precios - Test 100% Local</h2><p style="font-size:11px;color:#aaa">Solo para probar que funciona, sin GitHub, sin token</p></div>

<div class="card">
<div class="upload">
<div class="box"><b>Distribuidor</b><div id="stD" style="font-size:11px;margin:6px 0;color:#5ee">Sin cargar</div><button class="btn btn-secondary" onclick="document.getElementById('fD').click()">📂 Cargar PDF/Excel Dist</button><input type="file" id="fD" accept=".pdf,.xls,.xlsx,.csv" style="display:none"></div>
<div class="box"><b>Usuario</b><div id="stU" style="font-size:11px;margin:6px 0;color:#ffb">Sin cargar</div><button class="btn btn-secondary" onclick="document.getElementById('fU').click()">📂 Cargar PDF/Excel Usuario</button><input type="file" id="fU" accept=".pdf,.xls,.xlsx,.csv" style="display:none"></div>
</div>
<div id="res" style="display:none;margin-top:12px"><b id="stat"></b><div id="preview"></div></div>
</div>

<div class="card">
<button class="btn btn-primary" id="btnDown">⬇️ Descargar precios.json (para APPI)</button>
<button class="btn btn-secondary" onclick="testConEjemplo()">🧪 Probar con datos de ejemplo (sin subir archivos)</button>
<button class="btn btn-secondary" onclick="localStorage.clear(); location.reload()">🗑️ Limpiar</button>
<div id="log" style="font-size:10px;color:#aaa;margin-top:8px;white-space:pre-wrap"></div>
</div>

<script>
let dist=null,user=null;
function norm(s){return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,' ').trim();}
function parseNum(str){if(!str) return 0;let s=(''+str).replace(/[^\d.,-]/g,'');if(!s) return 0;if(s.indexOf('.')!==-1&&s.indexOf(',')!==-1){if(s.lastIndexOf(',')>s.lastIndexOf('.')){s=s.replace(/\./g,'').replace(',','.');}else{s=s.replace(/,/g,'');}}else if(s.indexOf(',')!==-1){const p=s.split(',');if(p.length===2&&p[1].length<=2){s=p[0].replace(/\./g,'')+'.'+p[1];}else{s=s.replace(/,/g,'');}}const n=parseFloat(s);return isNaN(n)?0:n;}
function detectar(headers){const m={};headers.forEach((h,i)=>{const nh=norm(h);if(/prod|modelo|art|nombre|codigo/.test(nh)&&m.nombre===undefined) m.nombre=i;if(/precio|importe|valor/.test(nh)&&m.precio===undefined) m.precio=i;if(/pb|punto/.test(nh)&&m.pb===undefined) m.pb=i;});if(m.nombre===undefined&&headers.length>0) m.nombre=0;return m;}
function parseRows(rows){
  if(!rows||rows.length<2) return [];
  let hr=-1;for(let i=0;i<Math.min(rows.length,20);i++){const r=rows[i]||[];const c=r.filter(v=>/prod|modelo|nombre|precio|pb|punto/i.test((v||'').toString())).length;if(c>=2){hr=i;break;}}if(hr===-1) hr=0;
  const headers=(rows[hr]||[]).map(v=>(v||'').toString().trim());const map=detectar(headers);const out=[];
  for(let i=hr+1;i<rows.length;i++){const r=rows[i]||[];if(r.every(v=>!v)) continue;const nomRaw=r[map.nombre];const nom=(nomRaw||'').toString().trim();if(!nom||nom.length<2) continue;let precio=0;if(map.precio!==undefined){const pv=r[map.precio];if(typeof pv==='number') precio=pv;else precio=parseNum(pv);}if(precio===0){for(let j=0;j<r.length;j++){if(j===map.nombre) continue;const v=r[j];if(typeof v==='number'&&v>100){precio=v;break;}}}let pb=0;if(map.pb!==undefined){pb=parseFloat((''+(r[map.pb]||'')).replace(',','.'))||0;}if(precio<100) continue;out.push({nombre:nom,nombreNorm:norm(nom),pb,precio});}
  return out;
}
async function extraerPDF(file){
  const buf=await file.arrayBuffer();const pdf=await pdfjsLib.getDocument({data:buf}).promise;let txt='';for(let i=1;i<=pdf.numPages;i++){const page=await pdf.getPage(i);const c=await page.getTextContent();let items=c.items.map(it=>({str:it.str,x:it.transform[4],y:it.transform[5]}));items.sort((a,b)=>{if(Math.abs(a.y-b.y)>2) return b.y-a.y;return a.x-b.x;});let curY=null,line='';for(const it of items){if(curY===null) curY=it.y;if(Math.abs(it.y-curY)>3){txt+=line+'\n';line=it.str;curY=it.y;}else{if(line&&!line.endsWith(' ')&&!it.str.startsWith(' ')) line+=' ';line+=it.str;}}if(line) txt+=line+'\n';}return txt;
}
function parseTexto(texto){
  const lines=texto.split(/\r?\n/).map(l=>l.trim()).filter(l=>l.length>3);const out=[];const ign=/^(lista de precios|precio|producto|modelo|catalogo|vigencia|distribuidor|usuario|página|page)/i;
  for(const raw of lines){
    if(ign.test(raw)) continue;
    let pb=0;let line=raw;
    const m=line.match(/(\d+(?:[.,]\d+)?)\s*PB/i)||line.match(/PB\s*[:\-]?\s*(\d+(?:[.,]\d+)?)/i);
    if(m){pb=parseFloat(m[1].replace(',','.'))||0;line=line.replace(m[0],'').trim();}
    let precio=0;let nombre=line;
    const pm=line.match(/(?:\$\s*)?(\d{1,3}(?:[.,]\d{3})*(?:[.,]\d{2})?|\d{3,})\s*$/);
    if(pm){precio=parseNum(pm[1]);if(precio>0){nombre=line.substring(0,pm.index).trim().replace(/[-–—·;:]+$/,'').trim();}}
    if(precio===0){
      const all=[...raw.matchAll(/(\d{1,3}(?:[.,]\d{3})*(?:[.,]\d{2})?)/g)];
      if(all.length>=1){const last=all[all.length-1][1];const v=parseNum(last);if(v>=100){precio=v;nombre=raw.substring(0,raw.lastIndexOf(all[all.length-1][1])).trim();}}
    }
    if(!nombre||nombre.length<3||precio<100) continue;
    if(/^\d+$/.test(nombre)) continue;
    out.push({nombre,nombreNorm:norm(nombre),pb,precio});
  }
  return out;
}
function cruzar(){
  if(!dist||!user) return [];
  const map={};dist.forEach(d=>map[d.nombreNorm]=d);const res=[];const used=new Set();
  user.forEach(u=>{const d=map[u.nombreNorm];if(d){used.add(u.nombreNorm);const gan=u.precio-d.precio;const marg=d.precio>0?gan/d.precio*100:100;res.push({nombre:u.nombre,pb:u.pb||d.pb||0,precioDist:d.precio,precioUser:u.precio,ganancia:gan,margen:marg});}else{res.push({nombre:u.nombre,pb:u.pb||0,precioDist:0,precioUser:u.precio,ganancia:u.precio,margen:100,soloUser:true});}});
  dist.forEach(d=>{if(!used.has(d.nombreNorm)&&!res.find(x=>x.nombreNorm===d.nombreNorm)){res.push({nombre:d.nombre,pb:d.pb||0,precioDist:d.precio,precioUser:0,ganancia:-d.precio,margen:-100,soloDist:true});}});
  return res;
}
function fmt(n){if(n===0) return '-';return '$'+Number(n).toLocaleString('es-AR',{maximumFractionDigits:0});}
function render(){
  document.getElementById('stD').textContent=dist?`${dist.length} productos`:'Sin cargar';
  document.getElementById('stU').textContent=user?`${user.length} productos`:'Sin cargar';
  const resDiv=document.getElementById('res');const prev=document.getElementById('preview');
  if(dist&&user){
    const cruz=cruzar();
    resDiv.style.display='block';
    document.getElementById('stat').textContent=`Cruzados: ${cruz.filter(c=>!c.soloDist&&!c.soloUser).length} | Total: ${cruz.length}`;
    prev.innerHTML=`<table><tr><th>Producto</th><th>PB</th><th>Dist</th><th>User</th><th>Gan</th></tr>${cruz.slice(0,50).map(c=>`<tr><td>${c.nombre}</td><td>${c.pb||'-'}</td><td>${fmt(c.precioDist)}</td><td>${fmt(c.precioUser)}</td><td style="color:${c.ganancia>=0?'#5ee':'#f88'}">${fmt(c.ganancia)}</td></tr>`).join('')}</table>`;
    document.getElementById('log').textContent='Cruzados OK: '+cruz.length+' productos\nDist: '+dist.length+'\nUser: '+user.length;
  } else {
    resDiv.style.display='none';
  }
}
async function procesar(file,tipo){
  const esPDF=file.name.toLowerCase().endsWith('.pdf');
  try{
    if(esPDF){
      document.getElementById('log').textContent='Leyendo PDF '+file.name+'...';
      const texto=await extraerPDF(file);
      document.getElementById('log').textContent='Texto extraido '+texto.length+' chars, parseando...\n'+texto.slice(0,500);
      const parsed=parseTexto(texto);
      if(parsed.length===0){alert('No se detectaron productos. Texto extraido:\n\n'+texto.slice(0,1000));return;}
      if(tipo==='dist'){dist=parsed;localStorage.setItem('test_dist',JSON.stringify(parsed));}else{user=parsed;localStorage.setItem('test_user',JSON.stringify(parsed));}
      render();
    } else {
      const data=new Uint8Array(await file.arrayBuffer());
      const wb=XLSX.read(data,{type:'array'});
      const ws=wb.Sheets[wb.SheetNames[0]];
      const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
      const parsed=parseRows(rows);
      if(parsed.length===0){alert('No se detectaron');return;}
      if(tipo==='dist'){dist=parsed;localStorage.setItem('test_dist',JSON.stringify(parsed));}else{user=parsed;localStorage.setItem('test_user',JSON.stringify(parsed));}
      render();
    }
  }catch(e){alert('Error: '+e.message);console.error(e);document.getElementById('log').textContent='Error: '+e.message+'\n'+e.stack;}
}

document.getElementById('fD').onchange=e=>{const f=e.target.files[0];if(f) procesar(f,'dist');e.target.value='';};
document.getElementById('fU').onchange=e=>{const f=e.target.files[0];if(f) procesar(f,'user');e.target.value='';};

document.getElementById('btnDown').onclick=()=>{
  if(!dist||!user){alert('Carga los 2 archivos primero');return;}
  const cruz=cruzar();
  const obj={version:1,actualizado:new Date().toISOString().split('T')[0],preciosDistribuidor:dist,preciosUsuario:user,preciosCruzados:cruz,productos:cruz.map(c=>({id:c.nombre.toLowerCase().replace(/[^a-z0-9]+/g,'_'),nombre:c.nombre,pb:c.pb,precioDist:c.precioDist,precioUser:c.precioUser,ganancia:c.ganancia,margen:c.margen}))};
  const blob=new Blob([JSON.stringify(obj,null,2)],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='precios.json';a.click();URL.revokeObjectURL(url);
};

function testConEjemplo(){
  dist=[{nombre:'Senior 4',nombreNorm:'senior 4',pb:5,precio:175000},{nombre:'Vero',nombreNorm:'vero',pb:3.5,precio:137500}];
  user=[{nombre:'Senior 4',nombreNorm:'senior 4',pb:5,precio:280000},{nombre:'Vero',nombreNorm:'vero',pb:3.5,precio:220000}];
  localStorage.setItem('test_dist',JSON.stringify(dist));
  localStorage.setItem('test_user',JSON.stringify(user));
  render();
}

// Cargar de localStorage al iniciar
try{const d=localStorage.getItem('test_dist');if(d) dist=JSON.parse(d);}catch(e){}
try{const u=localStorage.getItem('test_user');if(u) user=JSON.parse(u);}catch(e){}
render();
</script>
</body>
</html>
