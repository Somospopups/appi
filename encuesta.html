<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#edf3ff">
  <meta name="format-detection" content="telephone=no">
  <title>Mi Encuesta · APPI</title>
  <link rel="icon" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <script src="./auth-config.js"></script>
  <script src="./appi-dialog.js"></script>
  <style>
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    :root{--ink:#292938;--muted:#777887;--blue:#5b8def;--blue2:#3d63c9;--purple:#875fdd;--green:#2cb98f;--red:#d95359;--amber:#e99a20;--line:rgba(80,90,130,.13);--glass:rgba(255,255,255,.7);--shadow:0 16px 42px rgba(64,76,130,.13)}
    html{min-height:100%;background:#edf3ff;-webkit-text-size-adjust:100%}
    body{min-height:100vh;margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(circle at 10% 0,rgba(91,141,239,.24),transparent 34%),radial-gradient(circle at 95% 25%,rgba(160,107,255,.2),transparent 33%),linear-gradient(150deg,#edf4ff 0%,#f8f6ff 55%,#eef9f6 100%);overflow-x:hidden}
    body:before{content:"";position:fixed;inset:0;pointer-events:none;background:linear-gradient(rgba(255,255,255,.16),rgba(255,255,255,0));z-index:-1}
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    .shell{width:min(100%,690px);margin:0 auto;padding:max(18px,env(safe-area-inset-top)) 14px max(30px,env(safe-area-inset-bottom))}
    .brand{display:flex;align-items:center;justify-content:center;gap:9px;margin:2px 0 15px;color:#434453;font-size:11px;font-weight:950;letter-spacing:.9px;text-transform:uppercase}
    .brand img{width:30px;height:30px;border-radius:10px;box-shadow:0 5px 12px rgba(91,141,239,.22)}
    .hero{position:relative;overflow:hidden;padding:24px 22px 20px;border-radius:28px;color:#fff;background:linear-gradient(135deg,#4f79df 0%,#765bd7 62%,#9b68ef 100%);box-shadow:0 18px 43px rgba(77,84,190,.26)}
    .hero:after{content:"";position:absolute;width:190px;height:190px;border-radius:50%;right:-82px;top:-100px;background:rgba(255,255,255,.14)}
    .hero>*{position:relative;z-index:1}
    .hero-row{display:flex;align-items:center;gap:14px}
    .hero-icon{width:53px;height:53px;border-radius:18px;display:grid;place-items:center;flex:none;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.22);font-size:25px}
    .hero .eyebrow{font-size:9px;font-weight:950;letter-spacing:.9px;text-transform:uppercase;opacity:.78}
    .hero h1{margin:3px 0 1px;font-size:27px;line-height:1;letter-spacing:-.8px}
    .hero p{margin:5px 0 0;font-size:11.5px;line-height:1.4;opacity:.86}
    .progress-wrap{margin-top:18px}
    .progress-label{display:flex;justify-content:space-between;gap:12px;margin-bottom:7px;font-size:9px;font-weight:900;letter-spacing:.3px;text-transform:uppercase;opacity:.85}
    .progress-track{height:6px;border-radius:99px;background:rgba(255,255,255,.18);overflow:hidden}
    .progress-fill{height:100%;border-radius:99px;background:#fff;transition:width .35s ease;box-shadow:0 0 14px rgba(255,255,255,.35)}
    .status-card,.step-card{margin-top:13px;padding:18px;border-radius:23px;background:var(--glass);border:1px solid rgba(255,255,255,.85);box-shadow:var(--shadow);backdrop-filter:blur(18px) saturate(145%);-webkit-backdrop-filter:blur(18px) saturate(145%)}
    .status-card{text-align:center;padding:35px 20px}
    .status-card .ico{font-size:38px;margin-bottom:8px}.status-card h2{margin:0 0 6px;font-size:19px}.status-card p{margin:0 auto;color:var(--muted);font-size:12px;line-height:1.48;max-width:440px}
    .spinner{width:28px;height:28px;margin:0 auto 12px;border:3px solid rgba(91,141,239,.18);border-top-color:var(--blue);border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    .step-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:17px}
    .step-number{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none;color:#fff;background:linear-gradient(135deg,var(--blue),var(--purple));font-size:17px;font-weight:950;box-shadow:0 7px 17px rgba(91,112,210,.24)}
    .step-head h2{margin:1px 0 3px;font-size:18px;letter-spacing:-.3px}.step-head p{margin:0;color:var(--muted);font-size:11px;line-height:1.4}
    .field{padding:15px;margin-top:10px;border-radius:18px;background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.75);transition:.2s ease}
    .field.error{border-color:rgba(217,83,89,.55);background:rgba(217,83,89,.055)}
    .field-label{display:block;margin:0 0 10px;color:#383846;font-size:12.5px;font-weight:850;line-height:1.35}
    .field-label small{display:block;margin-top:3px;color:var(--muted);font-size:9.5px;font-weight:650}
    .required{color:var(--red)}
    .text-input,.other-input{width:100%;min-height:47px;border:1px solid var(--line);border-radius:14px;padding:11px 13px;background:rgba(249,250,255,.85);color:var(--ink);font-size:16px;outline:none;appearance:none;-webkit-appearance:none}
    .text-input:focus,.other-input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(91,141,239,.11);background:#fff}
    .text-input::placeholder,.other-input::placeholder{color:#a3a4af}
    .chips{display:flex;flex-wrap:wrap;gap:7px}
    .chip{min-height:39px;padding:8px 11px;border:1px solid rgba(91,100,140,.12);border-radius:12px;background:rgba(246,248,255,.76);color:#555663;font-size:10.5px;font-weight:800;line-height:1.2;transition:.15s ease}
    .chip:active{transform:scale(.97)}.chip.selected{color:#fff;border-color:transparent;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 5px 13px rgba(91,112,210,.2)}
    .other-wrap{margin-top:8px}.rating{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}.rating button{aspect-ratio:1;border:1px solid var(--line);border-radius:10px;background:#f7f8ff;color:#646573;font-size:11px;font-weight:900}.rating button.selected{color:#fff;border:0;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 4px 10px rgba(91,112,210,.22)}
    .error-text{display:none;margin-top:7px;color:var(--red);font-size:9.5px;font-weight:800}.field.error .error-text{display:block}
    .ref-list{display:grid;gap:10px}.ref-card{padding:14px;border-radius:17px;background:rgba(247,248,255,.76);border:1px solid var(--line)}
    .ref-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}.ref-head b{color:var(--blue2);font-size:11px}.ref-remove{border:0;border-radius:9px;padding:6px 9px;background:rgba(217,83,89,.09);color:#bb444b;font-size:9px;font-weight:900}
    .ref-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.ref-grid .text-input{min-height:43px;font-size:14px}.ref-grid .wide{grid-column:1/-1}
    .agenda-box{padding:13px;margin-bottom:11px;border-radius:17px;background:linear-gradient(135deg,rgba(91,141,239,.10),rgba(160,107,255,.08));border:1px solid rgba(91,141,239,.14);text-align:center}.agenda-btn{width:100%;min-height:47px;border:0;border-radius:14px;color:#fff;background:linear-gradient(135deg,#5b8def,#875fdd);box-shadow:0 7px 16px rgba(91,112,210,.22);font-size:11px;font-weight:950}.agenda-box small{display:block;margin-top:7px;color:#6d6e7a;font-size:8.8px;line-height:1.4}.agenda-divider{display:flex;align-items:center;gap:9px;margin:12px 0 9px;color:#92939e;font-size:8.5px;font-weight:900;text-transform:uppercase;letter-spacing:.4px}.agenda-divider:before,.agenda-divider:after{content:"";height:1px;flex:1;background:rgba(80,90,130,.11)}
    .add-ref{width:100%;min-height:44px;margin-top:10px;border:1px dashed rgba(91,141,239,.34);border-radius:14px;background:rgba(91,141,239,.07);color:var(--blue2);font-size:11px;font-weight:900}
    .referidos-callout{display:grid;grid-template-columns:42px 1fr;gap:11px;align-items:center;padding:13px;border-radius:16px;background:linear-gradient(135deg,rgba(91,141,239,.11),rgba(160,107,255,.09));border:1px solid rgba(91,141,239,.13);margin-bottom:12px}.referidos-callout span{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,#3ad0a4,#5b8def);color:#fff;font-size:19px}.referidos-callout b{display:block;font-size:11px}.referidos-callout small{display:block;margin-top:3px;color:var(--muted);font-size:9.5px;line-height:1.35}
    .review-grid{display:grid;gap:9px}.review-section{padding:14px;border-radius:17px;background:rgba(255,255,255,.58);border:1px solid rgba(255,255,255,.78)}.review-section h3{margin:0 0 9px;font-size:12px;color:var(--blue2)}
    .review-row{display:grid;grid-template-columns:44% 1fr;gap:10px;padding:7px 0;border-bottom:1px solid rgba(80,90,130,.08);font-size:10px;line-height:1.35}.review-row:last-child{border-bottom:0}.review-row span:first-child{color:var(--muted);font-weight:750}.review-row span:last-child{text-align:right;font-weight:850;overflow-wrap:anywhere}
    .consent{display:flex;gap:10px;align-items:flex-start;margin-top:10px;padding:13px;border-radius:15px;background:rgba(91,141,239,.065);border:1px solid rgba(91,141,239,.1);cursor:pointer}.consent input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--blue)}.consent span{font-size:10px;color:#555663;line-height:1.45}.consent strong{color:var(--ink)}
    .privacy{margin-top:12px;padding:12px;border-radius:14px;background:rgba(58,208,164,.08);border:1px solid rgba(58,208,164,.14);color:#36665a;font-size:9.5px;line-height:1.45}
    .nav-actions{display:grid;grid-template-columns:1fr 1.5fr;gap:9px;margin-top:13px}.nav-actions.single{grid-template-columns:1fr}.nav-btn{min-height:49px;border:0;border-radius:15px;font-size:12px;font-weight:950}.nav-back{background:rgba(255,255,255,.65);color:#646573;border:1px solid rgba(255,255,255,.82)}.nav-next{color:#fff;background:linear-gradient(135deg,var(--blue),var(--purple));box-shadow:0 8px 18px rgba(91,112,210,.23)}.nav-submit{color:#fff;background:linear-gradient(135deg,#25aa82,#4b83e5);box-shadow:0 8px 18px rgba(45,151,130,.2)}.nav-btn:disabled{opacity:.48;cursor:default;box-shadow:none}
    .success{padding:36px 18px;text-align:center}.success-mark{width:76px;height:76px;margin:0 auto 13px;border-radius:25px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#29b78b,#5b8def);font-size:34px;box-shadow:0 14px 32px rgba(53,164,143,.25)}.success h2{margin:0 0 7px;font-size:22px}.success p{margin:0 auto;color:var(--muted);font-size:12px;line-height:1.5;max-width:420px}.success .privacy{margin:18px auto 0;max-width:460px}
    .honeypot{position:fixed!important;left:-10000px!important;top:auto!important;width:1px!important;height:1px!important;overflow:hidden!important;opacity:0!important}
    .footer{text-align:center;margin:18px 0 4px;color:#8a8b97;font-size:8.5px;font-weight:700}
    @media(max-width:520px){.shell{padding-left:10px;padding-right:10px}.hero{padding:20px 17px 17px;border-radius:24px}.hero h1{font-size:24px}.step-card{padding:13px;border-radius:21px}.field{padding:13px}.rating{grid-template-columns:repeat(5,1fr)}.rating button{aspect-ratio:auto;min-height:38px}.ref-grid{grid-template-columns:1fr}.ref-grid .wide{grid-column:auto}.review-row{grid-template-columns:40% 1fr}.chips{gap:6px}.chip{padding:8px 9px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand"><img src="./icon-192.png" alt="APPI"><span>APPI · Mi Encuesta</span></div>
    <section class="hero">
      <div class="hero-row">
        <div class="hero-icon" id="heroIcon">💧</div>
        <div><div class="eyebrow" id="heroEyebrow">Encuesta compartida</div><h1 id="heroTitle">Mi Encuesta</h1><p id="heroSubtitle">Cargando el enlace…</p></div>
      </div>
      <div class="progress-wrap" id="progressWrap" hidden>
        <div class="progress-label"><span id="progressTitle">Paso 1</span><span id="progressCount">1 de 6</span></div>
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      </div>
    </section>
    <div id="content"><section class="status-card"><div class="spinner"></div><h2>Preparando la encuesta</h2><p>Estamos verificando el enlace seguro.</p></section></div>
    <div id="actions"></div>
    <div class="footer">Tus respuestas se envían de forma segura al distribuidor que compartió este enlace.</div>
  </main>
  <script>
  (function(){
    'use strict';
    const $=id=>document.getElementById(id);
    const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const token=new URLSearchParams(location.search).get('t')||'';
    const steps=[
      {title:'Tus datos',sub:'Para poder comunicarnos con vos.',icon:'👤'},
      {title:'Agua y hábitos',sub:'Cómo consumís y valorás el agua.',icon:'💧'},
      {title:'Calidad y ambiente',sub:'Tu mirada sobre el agua y el entorno.',icon:'🌿'},
      {title:'Actividad laboral',sub:'Qué valorás y qué te gustaría cambiar.',icon:'💼'},
      {title:'Referidos',sub:'Personas a las que también podría interesarles.',icon:'👥'},
      {title:'Revisar y enviar',sub:'Confirmá que todo esté correcto.',icon:'✓'}
    ];
    const OPTIONS={
      agua_tipo:[['🚰','De red/canilla'],['🍶','Mineral embotellada'],['⛰️','De pozo'],['🔬','Filtrada/Purificada'],['🪣','Bidón/Dispenser'],['✏️','Otros']],
      agua_cantidad:[['🥛','Menos de 1 litro'],['💧','1 a 2 litros'],['🌊','2 a 3 litros'],['🍶','Más de 3 litros'],['❓','No sé'],['✏️','Otros']],
      calidad:[['⭐','Muy buena'],['👍','Buena'],['😐','Regular'],['👎','Mala'],['⚠️','Muy mala']],
      si_no:[['✅','Sí'],['❌','No']],
      anomalias:[['👃','Olor'],['👅','Sabor'],['🎨','Color'],['✨','Ninguna']],
      potabilizadores:[['🧪','Cloro'],['⚗️','Aluminio'],['🦷','Flúor'],['🌀','Ozono'],['❓','No conocía ninguno'],['✏️','Otros']],
      alternativas:[['🚰','Filtros de agua'],['💧','Purificadores de agua'],['🍶','Agua embotellada'],['🔥','Hervir el agua'],['❓','No conozco ninguna alternativa'],['✏️','Otros']],
      ambiente:[['🌟','Sí, mucho'],['🌱','Sí, algo'],['😐','No mucho'],['❌','No']],
      laboral_dedica:[['👔','Empleado/a en relación de dependencia'],['💼','Independiente/Autónomo'],['🏢','Empresario/a'],['🎓','Estudiante'],['🔍','Desempleado/a'],['🏠','Ama de casa'],['🛋️','Jubilado/a'],['✏️','Otros']],
      laboral_gusta:[['🔒','Estabilidad'],['💰','Sueldo'],['👥','Compañeros'],['📈','Crecimiento profesional'],['⏰','Horarios flexibles'],['❤️','Vocación/Pasión'],['📍','Ubicación'],['✏️','Otros']],
      laboral_mejorar:[['💵','Sueldo'],['⏰','Horarios'],['👔','Relación con jefes'],['🏢','Ambiente laboral'],['📈','Crecimiento'],['🔒','Estabilidad'],['🎁','Beneficios'],['✏️','Otros']],
      conoces:[['👥','Sí, varios'],['👤','Sí, alguno'],['🤔','Tal vez'],['❌','No']],
      oportunidad:[['🎯','Sí, mucho'],['👍','Sí, algo'],['ℹ️','Quiero más info'],['❌','No']]
    };
    const fields={
      agua_tipo:{label:'¿Qué tipo de agua tomás?',options:'agua_tipo',multi:true,other:true},
      agua_cantidad:{label:'¿Sabés cuánta agua se recomienda beber por día aproximadamente?',options:'agua_cantidad',single:true,other:true},
      agua_importancia:{label:'Del 1 al 10, ¿qué tan importante es el agua para vos?',rating:true},
      agua_calidad:{label:'¿Cómo considerás el agua que sale de tu canilla o grifo?',options:'calidad',single:true},
      agua_calidad_como:{label:'¿Cómo calificarías su calidad general?',options:'calidad',single:true},
      agua_proviene:{label:'¿Sabés de dónde proviene?',options:'si_no',single:true},
      agua_anomalias:{label:'El agua debería ser inodora, incolora e insípida. ¿Notaste alguna vez…?',options:'anomalias',multi:true,exclusive:'Ninguna'},
      agua_turbidez:{label:'¿Notaste alguna vez turbidez en el agua?',options:'si_no',single:true},
      agua_potabilizadores:{label:'¿Cuáles de estos elementos conocías que se utilizan para potabilizar el agua?',options:'potabilizadores',multi:true,other:true,exclusive:'No conocía ninguno'},
      evitar_sustancias:{label:'¿Pensás que sería bueno para tu salud y la de tu familia evitar estas sustancias?',options:'si_no',single:true},
      alternativas_evitar:{label:'Si quisieras evitarlas, ¿qué alternativas conocés?',options:'alternativas',multi:true,other:true,exclusive:'No conozco ninguna alternativa'},
      ambiente:{label:'¿Te parece importante el cuidado del medio ambiente?',options:'ambiente',single:true},
      laboral_dedica:{label:'¿A qué te dedicás?',options:'laboral_dedica',single:true,other:true},
      laboral_gusta:{label:'¿Qué te gusta de tu trabajo o actividad?',options:'laboral_gusta',multi:true,other:true},
      laboral_mejorar:{label:'¿Qué cambiarías?',options:'laboral_mejorar',multi:true,other:true},
      conoces:{label:'¿Conocés personas que estén buscando un cambio?',options:'conoces',single:true},
      oportunidad:{label:'¿Te gustaría conocer una oportunidad?',options:'oportunidad',single:true}
    };
    const requiredByStep=[[],['agua_tipo','agua_cantidad','agua_importancia','agua_calidad'],['agua_calidad_como','agua_proviene','agua_anomalias','agua_turbidez','agua_potabilizadores','evitar_sustancias','alternativas_evitar','ambiente'],['laboral_dedica','laboral_gusta','laboral_mejorar','conoces','oportunidad'],[],[]];
    function uuidV4(){if(crypto.randomUUID)return crypto.randomUUID();const bytes=new Uint8Array(16);crypto.getRandomValues(bytes);bytes[6]=(bytes[6]&15)|64;bytes[8]=(bytes[8]&63)|128;const h=[...bytes].map(v=>v.toString(16).padStart(2,'0')).join('');return `${h.slice(0,8)}-${h.slice(8,12)}-${h.slice(12,16)}-${h.slice(16,20)}-${h.slice(20)}`}
    const fresh=()=>({step:0,nombre:'',telefono:'',answers:{},referidos:[],consentimiento:false,autorizacion_referidos:false,website:'',submission_id:uuidV4(),promptedRefs:false});
    const storageKey=`appi_encuesta_draft_${token}`;
    let data=fresh(),config=null,submitting=false,finished=false;
    try{const saved=JSON.parse(sessionStorage.getItem(storageKey)||'null');if(saved&&saved.submission_id)data={...fresh(),...saved,answers:saved.answers||{},referidos:Array.isArray(saved.referidos)?saved.referidos:[]}}catch(e){}
    function save(){try{sessionStorage.setItem(storageKey,JSON.stringify(data))}catch(e){}}
    function cfg(){return window.APPI_AUTH||{}}
    function api(path){return String(cfg().url||'').replace(/\/$/,'')+path}
    async function request(path,options={}){
      const r=await fetch(api(path),{...options,cache:'no-store',headers:{apikey:cfg().anonKey,'Content-Type':'application/json',...(options.headers||{})}});
      const text=await r.text();let body={};try{body=text?JSON.parse(text):{}}catch(e){}
      if(!r.ok)throw new Error(body.error||'No pudimos completar la operación.');return body;
    }
    function values(key){const value=data.answers[key];return Array.isArray(value)?value:(value==null||value===''?[]:[String(value)])}
    function hasValue(key){const value=data.answers[key];return Array.isArray(value)?value.length>0:value!==undefined&&value!==null&&String(value)!==''}
    function fieldHTML(key){
      const f=fields[key],current=values(key);let control='';
      if(f.rating){control='<div class="rating" data-rating="agua_importancia">'+Array.from({length:10},(_,i)=>`<button type="button" class="${Number(data.answers[key])===i+1?'selected':''}" data-rate="${i+1}">${i+1}</button>`).join('')+'</div>'}
      else{control='<div class="chips">'+OPTIONS[f.options].map(([icon,label])=>`<button type="button" class="chip ${current.includes(label)?'selected':''}" data-field="${key}" data-value="${esc(label)}">${icon} ${esc(label)}</button>`).join('')+'</div>';if(f.other&&current.includes('Otros'))control+=`<div class="other-wrap"><input class="other-input" data-other="${key}" maxlength="160" placeholder="Contanos un poco más…" value="${esc(data.answers[key+'_otros']||'')}"></div>`}
      return `<div class="field" data-field-wrap="${key}"><label class="field-label">${esc(f.label)} <span class="required">*</span></label>${control}<div class="error-text">Completá esta respuesta para continuar.</div></div>`;
    }
    function personalHTML(){return `<div class="field" data-field-wrap="nombre"><label class="field-label">Nombre y apellido <span class="required">*</span></label><input class="text-input" id="surveyName" autocomplete="name" maxlength="120" placeholder="Tu nombre completo" value="${esc(data.nombre)}"><div class="error-text">Ingresá tu nombre y apellido.</div></div><div class="field" data-field-wrap="telefono"><label class="field-label">Teléfono o WhatsApp <span class="required">*</span><small>Lo usaremos únicamente para poder contactarte.</small></label><input class="text-input" id="surveyPhone" type="tel" inputmode="tel" autocomplete="tel" maxlength="30" placeholder="Ej: 351 555 1234" value="${esc(data.telefono)}"><div class="error-text">Ingresá un teléfono válido.</div></div><label class="honeypot">Sitio web<input id="surveyWebsite" tabindex="-1" autocomplete="off" value="${esc(data.website)}"></label>`}
    function refsHTML(){
      const cards=data.referidos.map((r,i)=>`<div class="ref-card" data-ref="${i}"><div class="ref-head"><b>Referido ${i+1}</b><button type="button" class="ref-remove" data-remove-ref="${i}">Quitar</button></div><div class="ref-grid"><input class="text-input" data-ref-field="nombre" data-ref-index="${i}" maxlength="120" placeholder="Nombre y apellido" value="${esc(r.nombre||'')}"><input class="text-input" type="tel" inputmode="tel" data-ref-field="telefono" data-ref-index="${i}" maxlength="30" placeholder="Teléfono / WhatsApp" value="${esc(r.telefono||'')}"><input class="text-input" data-ref-field="relacion" data-ref-index="${i}" maxlength="80" placeholder="Relación (amigo, familiar…)" value="${esc(r.relacion||'')}"><input class="text-input" data-ref-field="zona" data-ref-index="${i}" maxlength="120" placeholder="Barrio / ciudad" value="${esc(r.zona||'')}"></div><div class="error-text">Completá nombre y teléfono o quitá este referido.</div></div>`).join('');
      return `<div class="referidos-callout"><span>👥</span><div><b>Una recomendación puede abrir una puerta</b><small>Los referidos son opcionales. Si conocés a alguien a quien pueda interesarle, podés sumarlo acá.</small></div></div><div class="agenda-box"><button type="button" class="agenda-btn" id="pickContacts">📇 Elegir desde mi agenda</button><small id="agendaSupport">Elegís qué personas compartir. APPI nunca accede al resto de tu agenda.</small></div><div class="agenda-divider">o cargalos manualmente</div><div class="ref-list" id="refList">${cards}</div><button type="button" class="add-ref" id="addRef" ${data.referidos.length>=10?'disabled':''}>+ Agregar un referido manualmente</button><div class="privacy">🔒 Los datos sólo serán entregados al distribuidor que te compartió esta encuesta. Si agregás referidos, al final te pediremos confirmar que te autorizaron a compartirlos.</div>`
    }
    const pretty=value=>Array.isArray(value)?value.join(', '):(value===undefined||value===null||value===''?'-':String(value));
    function reviewRows(keys){return keys.map(key=>{const f=fields[key];let value=data.answers[key];if(Array.isArray(value)&&value.includes('Otros')&&data.answers[key+'_otros'])value=value.map(v=>v==='Otros'?data.answers[key+'_otros']:v);return `<div class="review-row"><span>${esc(f.label)}</span><span>${esc(pretty(value))}</span></div>`}).join('')}
    function reviewHTML(){
      const refs=data.referidos.filter(r=>r.nombre||r.telefono);
      return `<div class="review-grid"><section class="review-section"><h3>👤 Tus datos</h3><div class="review-row"><span>Nombre</span><span>${esc(data.nombre)}</span></div><div class="review-row"><span>Teléfono</span><span>${esc(data.telefono)}</span></div></section><section class="review-section"><h3>💧 Agua y ambiente</h3>${reviewRows([...requiredByStep[1],...requiredByStep[2]])}</section><section class="review-section"><h3>💼 Actividad laboral</h3>${reviewRows(requiredByStep[3])}</section><section class="review-section"><h3>👥 Referidos</h3>${refs.length?refs.map((r,i)=>`<div class="review-row"><span>Referido ${i+1}</span><span>${esc(r.nombre)} · ${esc(r.telefono)}${r.zona?' · '+esc(r.zona):''}</span></div>`).join(''):'<div class="review-row"><span>Referidos cargados</span><span>Ninguno</span></div>'}</section></div><label class="consent"><input type="checkbox" id="consentMain" ${data.consentimiento?'checked':''}><span><strong>Autorizo el envío de mis datos y respuestas</strong> al distribuidor que compartió esta encuesta para que pueda contactarme.</span></label>${refs.length?`<label class="consent"><input type="checkbox" id="consentRefs" ${data.autorizacion_referidos?'checked':''}><span><strong>Confirmo que las personas referidas me autorizaron</strong> a compartir sus datos para que puedan ser contactadas.</span></label>`:''}<div class="privacy">APPI guarda la respuesta en una cuenta protegida. El distribuidor que te envió el enlace será el único que podrá verla y gestionarla dentro de Mi Gestión.</div>`
    }
    function stepBody(){if(data.step===0)return personalHTML();if(data.step===1)return ['agua_tipo','agua_cantidad','agua_importancia','agua_calidad'].map(fieldHTML).join('');if(data.step===2)return ['agua_calidad_como','agua_proviene','agua_anomalias','agua_turbidez','agua_potabilizadores','evitar_sustancias','alternativas_evitar','ambiente'].map(fieldHTML).join('');if(data.step===3)return ['laboral_dedica','laboral_gusta','laboral_mejorar','conoces','oportunidad'].map(fieldHTML).join('');if(data.step===4)return refsHTML();return reviewHTML()}
    function render(){
      if(finished)return;
      const s=steps[data.step];$('heroIcon').textContent=s.icon;$('heroTitle').textContent='Mi Encuesta';$('heroEyebrow').textContent=config&&config.distribuidor?`Compartida por ${config.distribuidor}`:'Encuesta compartida';$('heroSubtitle').textContent=s.sub;$('progressWrap').hidden=false;$('progressTitle').textContent=s.title;$('progressCount').textContent=`${data.step+1} de ${steps.length}`;$('progressFill').style.width=`${((data.step+1)/steps.length)*100}%`;
      $('content').innerHTML=`<section class="step-card"><div class="step-head"><div class="step-number">${s.icon}</div><div><h2>${esc(s.title)}</h2><p>${esc(s.sub)}</p></div></div>${stepBody()}</section>`;
      $('actions').innerHTML=`<div class="nav-actions ${data.step===0?'single':''}">${data.step?'<button type="button" class="nav-btn nav-back" id="prevStep">← Atrás</button>':''}<button type="button" class="nav-btn ${data.step===steps.length-1?'nav-submit':'nav-next'}" id="nextStep" ${submitting?'disabled':''}>${submitting?'Enviando…':data.step===steps.length-1?'Enviar encuesta':'Continuar →'}</button></div>`;
      bind();window.scrollTo({top:0,behavior:'smooth'});
    }
    function contactValue(value){if(Array.isArray(value))return String(value.find(Boolean)||'').trim();return String(value||'').trim()}
    function normalizedPhone(value){return String(value||'').replace(/\D/g,'').slice(0,15)}
    async function chooseContacts(){
      if(!navigator.contacts||typeof navigator.contacts.select!=='function'){
        await window.APPIDialog.alert('En Android podés abrir la agenda usando Chrome. En iPhone y otros navegadores esta función todavía no está habilitada; igualmente podés agregar los referidos manualmente.',{title:'Agenda no disponible',icon:'📇',okText:'Entendido'});return;
      }
      try{
        const selected=await navigator.contacts.select(['name','tel'],{multiple:true});
        if(!Array.isArray(selected)||!selected.length)return;
        const respondent=normalizedPhone(data.telefono),existing=new Set(data.referidos.map(ref=>normalizedPhone(ref.telefono)).filter(Boolean));let added=0,duplicates=0;
        for(const contact of selected){
          if(data.referidos.length>=10)break;
          const phone=contactValue(contact.tel),phoneKey=normalizedPhone(phone),name=contactValue(contact.name)||'Contacto de agenda';
          if(!phoneKey||phoneKey===respondent||existing.has(phoneKey)){duplicates++;continue}
          existing.add(phoneKey);data.referidos.push({nombre:name.slice(0,120),telefono:phone.slice(0,30),relacion:'',zona:''});added++;
        }
        save();render();
        if(added)await window.APPIDialog.alert(`${added} contacto${added===1?'':'s'} agregado${added===1?'':'s'} desde tu agenda.${duplicates?' Los repetidos no se volvieron a cargar.':''}`,{title:'Referidos agregados',icon:'✓',okText:'Continuar'});
        else if(duplicates)await window.APPIDialog.alert('Esos contactos ya estaban cargados o coinciden con tu propio teléfono.',{title:'Sin contactos nuevos',icon:'📇'});
      }catch(error){
        if(error&&['AbortError','NotAllowedError'].includes(error.name))return;
        await window.APPIDialog.alert('No pudimos abrir la agenda en este dispositivo. Podés continuar cargando los datos manualmente.',{title:'Agenda no disponible',icon:'📇'});
      }
    }
    function bind(){
      const name=$('surveyName'),phone=$('surveyPhone'),web=$('surveyWebsite');if(name)name.oninput=e=>{data.nombre=e.target.value;save()};if(phone)phone.oninput=e=>{data.telefono=e.target.value;save()};if(web)web.oninput=e=>{data.website=e.target.value;save()};
      document.querySelectorAll('[data-field]').forEach(button=>button.onclick=()=>selectChip(button));
      document.querySelectorAll('[data-rate]').forEach(button=>button.onclick=()=>{data.answers.agua_importancia=Number(button.dataset.rate);save();render()});
      document.querySelectorAll('[data-other]').forEach(input=>input.oninput=e=>{data.answers[input.dataset.other+'_otros']=e.target.value;save()});
      document.querySelectorAll('[data-ref-field]').forEach(input=>input.oninput=e=>{const i=Number(input.dataset.refIndex);data.referidos[i][input.dataset.refField]=e.target.value;save()});
      document.querySelectorAll('[data-remove-ref]').forEach(button=>button.onclick=()=>{data.referidos.splice(Number(button.dataset.removeRef),1);save();render()});
      if($('pickContacts'))$('pickContacts').onclick=chooseContacts;
      if($('addRef'))$('addRef').onclick=()=>{if(data.referidos.length<10)data.referidos.push({nombre:'',telefono:'',relacion:'',zona:''});save();render()};
      if($('consentMain'))$('consentMain').onchange=e=>{data.consentimiento=e.target.checked;save()};if($('consentRefs'))$('consentRefs').onchange=e=>{data.autorizacion_referidos=e.target.checked;save()};
      if($('prevStep'))$('prevStep').onclick=()=>{capture();data.step=Math.max(0,data.step-1);save();render()};$('nextStep').onclick=next;
    }
    function selectChip(button){
      const key=button.dataset.field,value=button.dataset.value,f=fields[key];let current=values(key);
      if(f.single)current=current.includes(value)?[]:[value];else if(current.includes(value))current=current.filter(v=>v!==value);else{if(f.exclusive&&value===f.exclusive)current=[value];else{current=current.filter(v=>v!==f.exclusive);current.push(value)}}
      data.answers[key]=current;if(value==='Otros'&&!current.includes('Otros'))data.answers[key+'_otros']='';save();render();
    }
    function capture(){const name=$('surveyName'),phone=$('surveyPhone'),web=$('surveyWebsite');if(name)data.nombre=name.value;if(phone)data.telefono=phone.value;if(web)data.website=web.value;document.querySelectorAll('[data-other]').forEach(input=>data.answers[input.dataset.other+'_otros']=input.value);document.querySelectorAll('[data-ref-field]').forEach(input=>{const i=Number(input.dataset.refIndex);if(data.referidos[i])data.referidos[i][input.dataset.refField]=input.value});if($('consentMain'))data.consentimiento=$('consentMain').checked;if($('consentRefs'))data.autorizacion_referidos=$('consentRefs').checked;save()}
    function markError(key){const el=document.querySelector(`[data-field-wrap="${key}"]`);if(el)el.classList.add('error');return el}
    function validate(){
      capture();document.querySelectorAll('.error').forEach(el=>el.classList.remove('error'));let first=null;
      if(data.step===0){if(data.nombre.trim().length<2)first=markError('nombre')||first;if(data.telefono.replace(/\D/g,'').length<8)first=markError('telefono')||first}
      for(const key of requiredByStep[data.step]||[])if(!hasValue(key))first=markError(key)||first;
      if(data.step===4){document.querySelectorAll('[data-ref]').forEach((card,i)=>{const r=data.referidos[i];if((r.nombre||r.telefono||r.relacion||r.zona)&&(r.nombre.trim().length<2||r.telefono.replace(/\D/g,'').length<8)){card.classList.add('error');first=first||card}})}
      if(data.step===5){if(!data.consentimiento){first=$('consentMain');$('consentMain').closest('.consent').style.borderColor='rgba(217,83,89,.55)'}if(data.referidos.length&&!data.autorizacion_referidos){first=first||$('consentRefs');$('consentRefs').closest('.consent').style.borderColor='rgba(217,83,89,.55)'}}
      if(first){first.scrollIntoView({behavior:'smooth',block:'center'});return false}return true;
    }
    async function next(){
      if(submitting||!validate())return;
      if(data.step===4&&!data.referidos.length&&!data.promptedRefs){data.promptedRefs=true;save();const add=await window.APPIDialog.confirm('¿Querés sumar algún referido antes de finalizar? Es opcional y podés continuar sin agregar ninguno.',{title:'Tus referidos pueden ayudar',icon:'👥',okText:'Agregar un referido',cancelText:'Continuar sin referidos'});if(add){data.referidos.push({nombre:'',telefono:'',relacion:'',zona:''});save();render();return}}
      if(data.step<steps.length-1){data.step++;save();render();return}await submit();
    }
    async function submit(){
      submitting=true;render();try{const result=await request('/functions/v1/encuesta-publica',{method:'POST',body:JSON.stringify({token,submission_id:data.submission_id,nombre:data.nombre,telefono:data.telefono,respuestas:data.answers,referidos:data.referidos,consentimiento:data.consentimiento,autorizacion_referidos:data.autorizacion_referidos,website:data.website})});finished=true;sessionStorage.removeItem(storageKey);$('progressWrap').hidden=true;$('heroIcon').textContent='✓';$('heroEyebrow').textContent='Envío confirmado';$('heroSubtitle').textContent='La información ya está disponible en Mi Gestión.';$('content').innerHTML=`<section class="step-card success"><div class="success-mark">✓</div><h2>¡Gracias por responder!</h2><p>Tu encuesta fue recibida correctamente y ya se encuentra en la cuenta de ${esc(config.distribuidor||'tu distribuidor')}.</p>${Number(result.referidos)>0?`<div class="privacy">También registramos ${Number(result.referidos)} referido${Number(result.referidos)===1?'':'s'} para que pueda${Number(result.referidos)===1?'':'n'} ser contactado${Number(result.referidos)===1?'':'s'}.</div>`:'<div class="privacy">No se cargaron referidos. Gracias por completar todas las respuestas.</div>'}</section>`;$('actions').innerHTML='';window.scrollTo({top:0,behavior:'smooth'})}catch(error){submitting=false;render();await window.APPIDialog.alert(error.message,{title:'No pudimos enviar la encuesta',icon:'!',okText:'Reintentar'})}
    }
    async function init(){
      if(!token||!cfg().url||!cfg().anonKey){showUnavailable('El enlace no tiene la información necesaria.');return}
      try{config=await request(`/functions/v1/encuesta-publica?token=${encodeURIComponent(token)}`,{method:'GET'});render()}catch(error){showUnavailable(error.message)}
    }
    function showUnavailable(message){$('progressWrap').hidden=true;$('heroSubtitle').textContent='El enlace no está disponible.';$('content').innerHTML=`<section class="status-card"><div class="ico">🔒</div><h2>No podemos abrir esta encuesta</h2><p>${esc(message)} Pedile al distribuidor que te envíe nuevamente su enlace desde APPI.</p></section>`;$('actions').innerHTML=''}
    window.APPIEncuesta={getData:()=>JSON.parse(JSON.stringify(data)),setData:value=>{data={...data,...value};save();render()},submit};
    init();
  })();
  </script>
</body>
</html>
