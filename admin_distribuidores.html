<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>APPI · Administración de distribuidores</title>
<script src="./auth-config.js"></script>
<script src="./auth-client.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:22px 14px 80px;background:linear-gradient(145deg,#111528,#2a1b42);color:#f5f6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:860px;margin:auto}.card{padding:20px;margin-bottom:14px;border:1px solid #ffffff17;border-radius:21px;background:#202239e8;box-shadow:0 12px 34px #0004}.brand{text-align:center}.brand b{font-size:24px}.brand p,.muted{color:#a7a9ba;font-size:12px;line-height:1.45}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}@media(max-width:620px){.grid{grid-template-columns:1fr}}label{display:block;margin:9px 0 6px;color:#b9c9ff;font-size:10px;font-weight:850;text-transform:uppercase}input,select{width:100%;min-height:44px;padding:11px 12px;border:1px solid #ffffff1d;border-radius:11px;background:#111426;color:#fff;font:inherit;outline:0}input:focus,select:focus{border-color:#6e9bff}button{min-height:42px;padding:10px 13px;border:0;border-radius:11px;background:#ffffff12;color:#fff;font:inherit;font-size:12px;font-weight:850;cursor:pointer}button:disabled{opacity:.5;cursor:wait}.primary{background:linear-gradient(135deg,#5b8def,#925fe2)}.danger{background:#a53d49}.good{background:#147d63}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:13px}.actions button{flex:1}.status{display:none;margin-top:12px;padding:11px;border-radius:11px;background:#2bbd9018;color:#7de0c0;font-size:12px}.status.show{display:block}.status.error{background:#d9534f18;color:#ffaaa5}.list{display:grid;gap:8px}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:13px;border-radius:14px;background:#ffffff0a;border:1px solid #ffffff0b}.item b,.item small{display:block}.item small{margin-top:4px;color:#a7a9ba}.item-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}.item-actions button{min-height:34px;padding:7px 9px}.badge{display:inline-block!important;width:max-content;margin-top:6px;padding:4px 7px;border-radius:999px;background:#31bc9120;color:#7de0c0;font-size:9px;font-weight:900}.badge.off{background:#d9534f20;color:#ffaaa5}.empty{text-align:center;padding:24px;color:#a7a9ba}.hidden{display:none!important}.topline{display:flex;align-items:center;justify-content:space-between;gap:10px}.topline h2{margin:0;font-size:17px}
</style>
</head>
<body>
<main class="wrap">
  <section class="card brand"><b>APPI</b><p>Panel privado de cuentas de distribuidores</p></section>

  <section class="card" id="loginCard">
    <h2 style="margin:0;font-size:17px">Ingreso de administrador</h2>
    <div class="grid">
      <div><label for="adminDip">Sucursal y distribuidor</label><input id="adminDip" autocomplete="username" placeholder="02-9802014" maxlength="15"></div>
      <div><label for="adminPassword">Contraseña</label><input id="adminPassword" type="password" autocomplete="current-password"></div>
    </div>
    <div class="actions"><button class="primary" id="login">Ingresar</button></div>
    <div class="status" id="loginStatus"></div>
  </section>

  <div id="adminArea" class="hidden">
    <section class="card">
      <div class="topline"><div><h2>Nueva cuenta</h2><p class="muted" id="adminIdentity"></p></div><button id="logout">Cerrar sesión</button></div>
      <div class="grid">
        <div><label for="newDip">Sucursal y distribuidor</label><input id="newDip" maxlength="15" placeholder="02-9802014"></div>
        <div><label for="newName">Nombre</label><input id="newName" maxlength="120"></div>
        <div><label for="newPassword">Contraseña inicial</label><input id="newPassword" type="text" minlength="8"></div>
        <div><label for="newRole">Rol</label><select id="newRole"><option value="usuario">Usuario</option><option value="admin">Administrador</option></select></div>
      </div>
      <div class="actions"><button id="generate">Generar contraseña</button><button class="primary" id="create">Crear cuenta</button></div>
      <div class="status" id="createStatus"></div>
    </section>

    <section class="card">
      <div class="topline"><div><h2>Cuentas</h2><p class="muted">Cada distribuidor ve únicamente sus propios datos gracias a RLS.</p></div><button id="refresh">Actualizar</button></div>
      <div class="list" id="list"><div class="empty">Cargando…</div></div>
    </section>
  </div>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=value=>String(value==null?'':value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function status(id,message,error=false){const node=$(id);node.textContent=message||'';node.className='status'+(message?' show':'')+(error?' error':'')}
function randomPassword(){const upper='ABCDEFGHJKLMNPQRSTUVWXYZ',lower='abcdefghijkmnopqrstuvwxyz',numbers='23456789',special='!@#$%',all=upper+lower+numbers+special,pick=set=>set[crypto.getRandomValues(new Uint32Array(1))[0]%set.length];const chars=[pick(upper),pick(lower),pick(numbers),pick(special)];while(chars.length<12)chars.push(pick(all));for(let i=chars.length-1;i>0;i--){const j=crypto.getRandomValues(new Uint32Array(1))[0]%(i+1);[chars[i],chars[j]]=[chars[j],chars[i]]}return chars.join('')}
async function callAdmin(body){
  const cfg=APPIAuth.config(),token=APPIAuth.accessToken();
  const response=await fetch(cfg.url.replace(/\/$/,'')+'/functions/v1/admin-distribuidores',{method:'POST',headers:{apikey:cfg.anonKey,Authorization:`Bearer ${token}`,'Content-Type':'application/json'},body:JSON.stringify(body)});
  const data=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(data.error||'No se pudo completar la operación.');
  return data;
}
function showAdmin(){const profile=APPIAuth.currentProfile();if(!profile||profile.rol!=='admin'){status('loginStatus','Esta cuenta no tiene permisos de administrador.',true);return false}$('loginCard').classList.add('hidden');$('adminArea').classList.remove('hidden');$('adminIdentity').textContent=`${profile.nombre||'Administrador'} · ${profile.dip}`;loadUsers();return true}
async function login(){const button=$('login');button.disabled=true;status('loginStatus','Ingresando…');try{await APPIAuth.login($('adminDip').value,$('adminPassword').value);if(!showAdmin()){await APPIAuth.logout()}}catch(error){status('loginStatus',error.message,true)}finally{button.disabled=false}}
async function loadUsers(){const list=$('list');list.innerHTML='<div class="empty">Cargando…</div>';try{const data=await callAdmin({action:'list'}),users=data.users||[];if(!users.length){list.innerHTML='<div class="empty">Todavía no hay cuentas.</div>';return}list.innerHTML=users.map(user=>`<article class="item" data-user-id="${esc(user.user_id)}"><div><b>${esc(user.nombre||'Sin nombre')}</b><small>DIP ${esc(user.dip)} · ${esc(user.rol)}</small><span class="badge ${user.activo?'':'off'}">${user.activo?'ACTIVA':'BLOQUEADA'}</span></div><div class="item-actions"><button data-action="password">Contraseña</button><button class="${user.activo?'danger':'good'}" data-action="active" data-active="${user.activo?'0':'1'}">${user.activo?'Bloquear':'Activar'}</button></div></article>`).join('');list.querySelectorAll('[data-action]').forEach(button=>button.onclick=()=>handleAction(button))}catch(error){list.innerHTML=`<div class="status show error">${esc(error.message)}</div>`}}
async function handleAction(button){const item=button.closest('[data-user-id]'),user_id=item.dataset.userId,action=button.dataset.action;button.disabled=true;try{if(action==='password'){const password=prompt('Nueva contraseña (mínimo 8 caracteres, letras y números):');if(!password)return;await callAdmin({action:'set_password',user_id,password});alert('Contraseña actualizada.')}else{const activo=button.dataset.active==='1';if(!confirm(activo?'¿Activar esta cuenta?':'¿Bloquear esta cuenta?'))return;await callAdmin({action:'set_active',user_id,activo});await loadUsers()}}catch(error){alert(error.message)}finally{button.disabled=false}}
$('login').onclick=login;$('adminDip').oninput=event=>event.target.value=APPIAuth.normalizeDip(event.target.value);$('newDip').oninput=event=>event.target.value=APPIAuth.normalizeDip(event.target.value);$('adminPassword').onkeydown=event=>{if(event.key==='Enter')login()};$('generate').onclick=()=>$('newPassword').value=randomPassword();$('refresh').onclick=loadUsers;
$('create').onclick=async()=>{const button=$('create');button.disabled=true;status('createStatus','Creando cuenta…');try{await callAdmin({action:'create',dip:$('newDip').value,nombre:$('newName').value,password:$('newPassword').value,rol:$('newRole').value});status('createStatus','Cuenta creada correctamente.');$('newDip').value='';$('newName').value='';$('newPassword').value='';await loadUsers()}catch(error){status('createStatus',error.message,true)}finally{button.disabled=false}};
$('logout').onclick=async()=>{await APPIAuth.logout();location.reload()};
(async()=>{if(!APPIAuth.isConfigured()){status('loginStatus','Primero configurá auth-config.js con la URL y la clave pública de Supabase.',true);$('login').disabled=true;return}const result=await APPIAuth.authorize();if(result.ok)showAdmin()})();
</script>
</body>
</html>
