<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>APPI · Administración de licencias</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:24px 14px;background:linear-gradient(145deg,#121528,#281b3e);color:#f5f6ff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:680px;margin:auto}.card{padding:20px;margin-bottom:14px;border:1px solid #ffffff17;border-radius:20px;background:#202239dc;box-shadow:0 12px 34px #0004}.brand{text-align:center}.brand b{font-size:24px}.brand p,.muted{color:#a7a9ba;font-size:12px;line-height:1.45}label{display:block;margin:12px 0 6px;color:#b9c9ff;font-size:11px;font-weight:800;text-transform:uppercase}input,textarea{width:100%;padding:12px;border:1px solid #ffffff1d;border-radius:11px;background:#111426;color:#fff;font:inherit;outline:0}input:focus,textarea:focus{border-color:#6e9bff}.mono{font-family:ui-monospace,monospace;text-transform:uppercase;letter-spacing:2px;text-align:center}.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}button{flex:1;min-width:120px;padding:11px;border:0;border-radius:11px;background:#ffffff12;color:#fff;font:inherit;font-size:12px;font-weight:850;cursor:pointer}.primary{background:linear-gradient(135deg,#5b8def,#925fe2)}.danger{background:#b9424c}.result{display:none;margin-top:14px;padding:15px;border:1px dashed #42d6ac77;border-radius:14px;background:#2bbd9014;text-align:center}.result.show{display:block}.code{font:900 22px ui-monospace,monospace;letter-spacing:3px}.list{display:grid;gap:7px;margin-top:12px}.item{display:flex;align-items:center;gap:8px;padding:11px;border-radius:12px;background:#ffffff0a}.item div{flex:1;min-width:0}.item b,.item small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.item small{margin-top:3px;color:#a7a9ba;font-size:10px}.item button{flex:0 0 auto;min-width:auto;padding:7px 9px}.empty{text-align:center;color:#a7a9ba;padding:18px}.toast{position:fixed;left:50%;top:16px;transform:translate(-50%,-90px);padding:10px 16px;border-radius:999px;background:#31bc91;transition:.25s;font-size:12px;font-weight:800}.toast.show{transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="toast" id="toast">Listo</div>
<main class="wrap">
  <section class="card brand"><b>APPI</b><p>Administración privada de licencias</p></section>
  <section class="card">
    <h2 style="margin:0;font-size:17px">Generar código</h2>
    <label for="deviceId">ID del dispositivo</label>
    <input class="mono" id="deviceId" maxlength="14" placeholder="XXXX-XXXX-XXXX">
    <label for="clientName">Nombre o referencia opcional</label>
    <input id="clientName" placeholder="Persona o dispositivo">
    <div class="btns"><button class="primary" id="generate">Generar y guardar</button></div>
    <div class="result" id="result"><div class="muted">Código de activación</div><div class="code" id="code">—</div><div class="btns"><button id="copy">Copiar</button></div></div>
  </section>
  <section class="card">
    <h2 style="margin:0;font-size:17px">Licencias guardadas</h2>
    <div class="list" id="list"></div>
    <div class="btns"><button id="export">Exportar backup</button><button id="import">Importar backup</button><button class="danger" id="clear">Borrar todo</button></div>
    <input type="file" id="file" accept=".json" hidden>
  </section>
</main>
<script>
const SECRET_KEY='APPI-2024-MH-PSA-GERMAN',KEY='appi_admin_licencias_v1';let current='';
const $=id=>document.getElementById(id);const load=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}};const save=x=>localStorage.setItem(KEY,JSON.stringify(x));
function hashCode(str){let hash=0;for(let i=0;i<str.length;i++){hash=((hash<<5)-hash)+str.charCodeAt(i);hash=hash&hash}return Math.abs(hash)}
function codeFor(id){const base=id+SECRET_KEY;return [base,base+'1',base+'2'].map(x=>hashCode(x).toString(36).toUpperCase().padStart(4,'0').slice(0,4)).join('-')}
function formatId(value){const x=String(value||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,12);return [x.slice(0,4),x.slice(4,8),x.slice(8,12)].filter(Boolean).join('-')}
function toast(msg){$('toast').textContent=msg;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)}
function render(){const rows=load();$('list').innerHTML=rows.length?rows.map((x,i)=>`<div class="item"><div><b>${String(x.name||'Sin referencia').replace(/[<>]/g,'')}</b><small>${x.deviceId} · ${x.code} · ${new Date(x.createdAt).toLocaleDateString('es-AR')}</small></div><button data-copy="${i}">Copiar</button><button class="danger" data-del="${i}">×</button></div>`).join(''):'<div class="empty">Sin licencias guardadas</div>';$('[data-copy]')
  document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>navigator.clipboard.writeText(rows[+b.dataset.copy].code).then(()=>toast('Código copiado')));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{const a=load();a.splice(+b.dataset.del,1);save(a);render()})}
$('deviceId').oninput=e=>e.target.value=formatId(e.target.value);$('generate').onclick=()=>{const id=formatId($('deviceId').value);if(id.length!==14){alert('Ingresá un ID completo');return}current=codeFor(id);$('code').textContent=current;$('result').classList.add('show');const rows=load();rows.unshift({name:$('clientName').value.trim(),deviceId:id,code:current,createdAt:new Date().toISOString()});save(rows);render();toast('Licencia guardada')};$('copy').onclick=()=>current&&navigator.clipboard.writeText(current).then(()=>toast('Código copiado'));
$('export').onclick=()=>{const blob=new Blob([JSON.stringify(load(),null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='appi_licencias_backup.json';a.click();URL.revokeObjectURL(url)};$('import').onclick=()=>$('file').click();$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const data=JSON.parse(r.result);if(!Array.isArray(data))throw 0;save(data);render();toast('Backup restaurado')}catch(_){alert('Backup inválido')}};r.readAsText(f);e.target.value=''};$('clear').onclick=()=>{if(confirm('¿Borrar todas las licencias guardadas?')){localStorage.removeItem(KEY);render()}};render();
</script>
</body>
</html>
