name: Pruebas de APPI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # La suite tarda unos 6 minutos y bajar el navegador puede tardar otros
    # tantos: con 15 el trabajo se cortaba antes de llegar a las pruebas.
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # El navegador se guarda entre corridas: sin esto se baja entero cada vez.
      - name: Recuperar el navegador guardado
        id: cache-navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar el navegador
        if: steps.cache-navegador.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Instalar solo lo que el navegador necesita del sistema
        if: steps.cache-navegador.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm test 2>&1 | tee /tmp/pt.log
        continue-on-error: true
      - name: Reportar fallos (diagnóstico)
        if: always()
        run: |
          grep -E "^[[:space:]]+[0-9]+\) " /tmp/pt.log | while read -r line; do
            echo "::error file=.github::FALLO-TEST $(echo "$line" | tr -d '[:space:]' | sed 's/::/;/g')"
          done
          grep -E "failed|passed" /tmp/pt.log | tail -6 | while read -r line; do
            echo "::error file=.github::RESUMEN $(echo "$line" | sed 's/::/;/g')"
          done
