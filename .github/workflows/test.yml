name: Pruebas de APPI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    # La suite creció con las versiones y ya no entra en 35 minutos en el
    # runner compartido (se cortaba a los 35 con tests todavía en curso).
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # El navegador se guarda entre corridas: sin esto se baja entero cada vez.
      - name: Recuperar el navegador guardado
        id: cache-navegador
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Instalar el navegador
        if: steps.cache-navegador.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Instalar solo lo que el navegador necesita del sistema
        if: steps.cache-navegador.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npm test
