name: Precios lista PSA

# Lee tienda.psa.com.ar y actualiza psa-precios.json, psa-catalogo.json y psa-planes.json
# (cuotas y bancos). Dos veces por día (8 y 17 ART) y a mano con workflow_dispatch.
# Comparativas y Lista de precios / Cotizar leen esos archivos siempre de red.
on:
  schedule:
    - cron: "0 11,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Leer precios, fotos y planes
        run: |
          python3 -m pip install --quiet pillow pypdf
          python3 scripts/actualizar-precios-psa.py

      - name: Publicar si cambiaron
        run: |
          git config user.name "APPI precios"
          git config user.email "298482267+arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add psa-precios.json psa-catalogo.json psa-planes.json catalogo-img
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "precios: lista tienda PSA"
          git push
