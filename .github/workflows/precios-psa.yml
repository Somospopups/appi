name: Precios lista PSA

# Lee tienda.psa.com.ar y actualiza psa-precios.json + psa-catalogo.json.
# Comparativas y Lista de precios usan esos archivos.
on:
  schedule:
    - cron: "0 11,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Leer precios de la tienda
        run: python3 scripts/actualizar-precios-psa.py

      - name: Publicar si cambiaron
        run: |
          git config user.name "APPI precios"
          git config user.email "298482267+arena-ai-coding-agent[bot]@users.noreply.github.com"
          git add psa-precios.json psa-catalogo.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "precios: lista tienda PSA"
          git push
