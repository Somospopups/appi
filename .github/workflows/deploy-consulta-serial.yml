name: Publicar recuperación histórica PSA

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/consulta-serial/**'
      - 'tests/e2e/psa-sync-automatico.spec.js'
      - '.github/workflows/deploy-consulta-serial.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-consulta-serial-main
  cancel-in-progress: true

jobs:
  validar-y-publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: tqwnjfnaywjmyfplvatm
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Instalar dependencias de prueba
        run: npm ci

      - name: Validar sintaxis de la función segura
        run: npx --yes esbuild@0.25.10 supabase/functions/consulta-serial/index.ts --bundle --platform=neutral --format=esm --external:https://* --outfile=/tmp/consulta-serial.js

      - name: Verificar URLs directas y respaldo
        run: npx playwright test tests/e2e/psa-sync-automatico.spec.js -g "URL directas" --reporter=line

      - name: Verificar credencial de despliegue
        run: test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Falta SUPABASE_ACCESS_TOKEN" && exit 1)

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar función consulta-serial
        run: supabase functions deploy consulta-serial --project-ref "$SUPABASE_PROJECT_ID"
