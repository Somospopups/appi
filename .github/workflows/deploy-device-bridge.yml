name: Publicar backend de cuentas y teléfonos

# Ejecución manual: requiere SUPABASE_ACCESS_TOKEN guardado como secret.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: tqwnjfnaywjmyfplvatm
    steps:
      - uses: actions/checkout@v4

      - name: Verificar credencial temporal
        run: test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Falta el secret SUPABASE_ACCESS_TOKEN" && exit 1)

      - name: Instalar titular, socio y teléfonos por persona
        run: |
          jq -Rs '{query: ., read_only: false}' SUPABASE_PERSONAS_CUENTA.sql > /tmp/personas-cuenta.json
          curl --fail-with-body --silent --show-error \
            --request POST \
            --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary @/tmp/personas-cuenta.json

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar administración de cuentas
        run: supabase functions deploy admin-distribuidores --project-ref "$SUPABASE_PROJECT_ID"

      - name: Publicar solicitudes de cuenta
        run: supabase functions deploy solicitud-cuenta --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"

      - name: Publicar teléfonos por persona
        run: supabase functions deploy dispositivo-puente --project-ref "$SUPABASE_PROJECT_ID"
