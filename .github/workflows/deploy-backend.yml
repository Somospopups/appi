name: Publicar backend completo de APPI

# Se puede ejecutar manualmente y también después de que la suite de main quede verde.
# Requiere SUPABASE_ACCESS_TOKEN guardado como secret del repositorio.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Pruebas de APPI"]
    types: [completed]

permissions:
  contents: read

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: tqwnjfnaywjmyfplvatm
    steps:
      - uses: actions/checkout@v4

      - name: Verificar credencial temporal
        run: test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Falta el secret SUPABASE_ACCESS_TOKEN" && exit 1)

      - name: Instalar esquema y migraciones
        run: |
          # El instalador consolidado crea la base; las migraciones posteriores
          # completan módulos agregados después y son seguras al reejecutarse.
          fallidas=""
          for migration in SUPABASE_INSTALACION_COMPLETA.sql SUPABASE_MI_GENTE.sql SUPABASE_MEMBRESIAS.sql SUPABASE_PERSONAS_CUENTA.sql SUPABASE_INVITACIONES_PERSONA.sql SUPABASE_RECORDATORIOS.sql; do
            echo "::group::$migration"
            jq -Rs '{query: ., read_only: false}' "$migration" > /tmp/migration.json
            if curl --fail-with-body --silent --show-error \
              --request POST \
              --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
              --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              --header "Content-Type: application/json" \
              --data-binary @/tmp/migration.json; then
              echo ""
              echo "OK: $migration"
            else
              echo ""
              echo "::error::Falló la migración $migration"
              fallidas="$fallidas $migration"
            fi
            echo "::endgroup::"
          done
          if [ -n "$fallidas" ]; then
            echo "Migraciones con error:$fallidas"
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Publicar administración de cuentas
        run: supabase functions deploy admin-distribuidores --project-ref "$SUPABASE_PROJECT_ID"

      - name: Publicar solicitudes de cuenta
        run: supabase functions deploy solicitud-cuenta --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"

      - name: Publicar recepción segura de encuestas
        run: supabase functions deploy encuesta-publica --no-verify-jwt --project-ref "$SUPABASE_PROJECT_ID"

      - name: Publicar teléfonos por persona
        run: supabase functions deploy dispositivo-puente --project-ref "$SUPABASE_PROJECT_ID"

      - name: Publicar análisis de Histórico
        run: supabase functions deploy historico-analisis --project-ref "$SUPABASE_PROJECT_ID"

      - name: Publicar recordatorios de Mi Gestión
        run: supabase functions deploy recordatorios-gestion --project-ref "$SUPABASE_PROJECT_ID"
